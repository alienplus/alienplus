<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" preserveAspectRatio="none" role="img" aria-label="Decorative wave">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <style>
      .w1 { animation: drift 14s linear infinite; }
      .w2 { animation: drift 22s linear infinite reverse; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-500px); } }
      @media (prefers-reduced-motion: reduce) { .w1,.w2 { animation: none; } }
    </style>
  </defs>
  <path class="w2" fill="#f5b83d" fill-opacity="0.18" d="M0 60 Q125 20 250 60 T500 60 T750 60 T1000 60 T1250 60 T1500 60 V120 H0 Z"/>
  <path class="w1" fill="url(#g)" d="M0 75 Q125 40 250 75 T500 75 T750 75 T1000 75 T1250 75 T1500 75 V120 H0 Z"/>
</svg>
